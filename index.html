<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6a2c91">
<title>دليل بدائل Push — انتقل لبوابة Better Health</title>
<meta http-equiv="refresh" content="0; url=https://pharmacy-portal.pages.dev/tools?open=push">
<link rel="icon" href="icon.svg">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3fa;color:#1d1630;font:500 16px/1.8 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
  main{max-width:420px;margin:24px;padding:28px 24px;text-align:center;background:#fff;border:1px solid #e5dff0;border-radius:20px;box-shadow:0 8px 24px rgba(75,29,112,.08)}
  img{width:120px;height:auto}
  h1{margin:12px 0 4px;font-size:20px}
  p{margin:0 0 18px;color:#675f7a}
  a{display:inline-block;padding:12px 22px;border-radius:12px;background:#6a2c91;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Better Health">
  <h1>دليل بدائل Push اتنقل لبوابة Better Health</h1>
  <p>بتفتح لوحدها… لو مافتحتش اضغط على الزرار وسجّل دخولك برقمك وكلمة مرورك.</p>
  <a href="https://pharmacy-portal.pages.dev/tools?open=push">افتح دليل بدائل Push</a>
</main>
<script>
  // نشيل النسخة القديمة المحفوظة على الجهاز (service worker) ونروح للأداة الجديدة
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
  location.replace('https://pharmacy-portal.pages.dev/tools?open=push');
</script>
</body>
</html>
